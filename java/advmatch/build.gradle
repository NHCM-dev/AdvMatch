plugins {
    id 'java-library'
}

group = 'nhcm'
version = '2.0.1'

tasks.withType(Jar).configureEach {
    manifest {
        attributes 'Implementation-Title': 'AdvMatch', 'Implementation-Version': project.version.toString()
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

sourceSets {
    main.java.srcDirs = ['src/main']
    test.java.srcDirs = ['src/test']
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def os = osName.startsWith('windows') ? 'windows' : (osName.contains('mac') || osName == 'darwin') ? 'macos' : 'linux'
def archName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def arch = archName == 'x86_64' ? 'amd64' : archName == 'aarch64' ? 'arm64' : archName
def libraries = [System.mapLibraryName('advmatch'), System.mapLibraryName('advmatch_jni')]

tasks.named('processResources') {
    dependsOn rootProject.tasks.named('buildNative')
    if (rootProject.withLinux) { dependsOn rootProject.tasks.named('buildLinuxNative') }
    from(rootProject.nativeDir) {
        include libraries
        into "native/${os}-${arch}"
    }
    if (rootProject.withLinux && os != 'linux') {
        from(rootProject.nativeBundles) {
            include 'linux-amd64/libadvmatch.so', 'linux-amd64/libadvmatch_jni.so'
            into 'native'
        }
    }
    doFirst {
        if (rootProject.withLinux && os != 'linux') {
            ['libadvmatch.so', 'libadvmatch_jni.so'].each {
                if (!new File(rootProject.nativeBundles, "linux-amd64/${it}").isFile()) {
                    throw new GradleException("Missing Linux bundle library: ${it}")
                }
            }
        }
        libraries.each {
            if (!new File(rootProject.nativeDir, it).isFile()) {
                throw new GradleException("Missing ${it} in ${rootProject.nativeDir}")
            }
        }
    }
}

tasks.register('integrationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nhcm.advmatch.BindingIntegrationTest'
    // No path override: also exercises the JAR/resource extraction loader.
}

def testJar = tasks.register('testJar', Jar) {
    group = 'build'
    description = 'Package integration tests, benchmarks and embedded native libraries in a runnable JAR'
    archiveClassifier = 'tests'
    from sourceSets.main.output
    from sourceSets.test.output
    manifest {
        attributes 'Main-Class': 'nhcm.advmatch.BindingIntegrationTest'
    }
}

tasks.named('assemble') { dependsOn testJar }

tasks.register('runExample', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'nhcm.advmatch.example.SpotExample'
}

tasks.named('check') { dependsOn 'integrationTest' }

// Standalone integration main keeps builds independent of Maven test runners.
tasks.named('test') {
    dependsOn 'integrationTest'
    enabled = false
}

[
    benchmarkTps: 'TpsBenchmark',
    benchmarkScale: 'ScaleBenchmark',
    benchmarkPerpetual: 'PerpetualBenchmark',
    benchmarkLiquidation: 'LiquidationBenchmark',
    benchmarkObserve: 'ObserveBenchmark',
    benchmarkBigAllocs: 'BigAllocsBenchmark',
    benchmarkSmoke: 'BenchmarkSmoke'
].each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'benchmarks'
        description = "Run ${className} through the Java SDK"
        dependsOn classes
        classpath = sourceSets.main.runtimeClasspath
        mainClass = "nhcm.advmatch.benchmark.${className}"
        if (taskName != 'benchmarkSmoke') {
            args providers.gradleProperty('benchmarkArgs').getOrElse('').tokenize()
        }
        jvmArgs providers.gradleProperty('benchmarkJvmArgs').getOrElse('').tokenize()
    }
}

tasks.named('check') { dependsOn 'benchmarkSmoke' }

tasks.register('remoteIntegrationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nhcm.advmatch.RemoteIntegrationTest'
}

def tlsCertificate = layout.buildDirectory.file("test-tls/endpoint-${java.time.LocalDate.now()}.p12")
tasks.register('testTlsCertificate', Exec) {
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get()
    def keytool = launcher.metadata.installationPath.file("bin/keytool${os == 'windows' ? '.exe' : ''}").asFile
    onlyIf { !tlsCertificate.get().asFile.exists() }
    doFirst { tlsCertificate.get().asFile.parentFile.mkdirs() }
    commandLine keytool, '-genkeypair', '-alias', 'endpoint', '-keyalg', 'RSA', '-keysize', '2048',
                '-validity', '2', '-dname', 'CN=localhost', '-ext', 'SAN=dns:localhost,ip:127.0.0.1',
                '-storetype', 'PKCS12', '-keystore', tlsCertificate.get().asFile,
                '-storepass', 'integration-password', '-keypass', 'integration-password', '-noprompt'
}
tasks.register('tlsRemoteIntegrationTest', JavaExec) {
    dependsOn testClasses, testTlsCertificate
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nhcm.advmatch.TlsRemoteIntegrationTest'
    args tlsCertificate.get().asFile.absolutePath
}
tasks.named('check') { dependsOn tlsRemoteIntegrationTest }

tasks.named('check') { dependsOn 'remoteIntegrationTest' }

tasks.register('nativeLoaderTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nhcm.advmatch.internal.NativeLoaderTest'
}
tasks.named('check') { dependsOn 'nativeLoaderTest' }

['subscriptionIntegrationTest': 'nhcm.advmatch.SubscriptionIntegrationTest',
 'admissionTest': 'nhcm.advmatch.remote.AdmissionTest'].each { taskName, entry ->
    tasks.register(taskName, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entry
    }
    tasks.named('check') { dependsOn taskName }
}
